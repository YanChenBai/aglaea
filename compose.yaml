services:
  aglaea:
    build:
      context: .
      dockerfile: Dockerfile
    image: aglaea:local
    container_name: aglaea
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - '${AGLAEA_PORT:-8787}:${PORT:-8787}'
    environment:
      PORT: '${PORT:-8787}'
      HOST: '${HOST:-0.0.0.0}'
      AGLAEA_PUBLIC_URL: '${AGLAEA_PUBLIC_URL:-http://localhost:${AGLAEA_PORT:-8787}}'
      AGLAEA_WEB_URL: '${AGLAEA_WEB_URL:-http://localhost:${AGLAEA_PORT:-8787}}'
      AGLAEA_STATIC_ROOT: '${AGLAEA_STATIC_ROOT:-/app/website}'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORT}/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
